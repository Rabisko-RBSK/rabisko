name: Esteira de Produção (main)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  check-source-branch:
    name: Validar Branch de Origem
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear origens não autorizadas
        if: github.head_ref != 'homol' && !startsWith(github.head_ref, 'hotfix/')
        run: |
          echo "ERRO DE GIT FLOW"
          echo "Pull Requests para a branch 'main' só podem vir da 'homol' ou de 'hotfix/'!"
          echo "Sua branch atual é: ${{ github.head_ref }}"
          exit 1

  frontend-checks:
    name: Validação (Frontend)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Instalar dependências
        run: npm install
      - name: Auditoria de Segurança (Vulnerabilidades Críticas)
        run: npm audit --audit-level=high

  backend-checks:
    name: Compilação (Backend)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - run: mvn clean compile -DskipTests
      - name: Verificar vulnerabilidades nas dependências Java
        run: mvn org.owasp:dependency-check-maven:check

  security-checks:
    name: Checagem de Secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: homol
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar credenciais vazadas (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-infra:
    name: Atualizar Supabase e Railway
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: homol
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar Migrations no Supabase Prod
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID_HOMOL }}" --password "${{ secrets.SUPABASE_DB_PASSWORD_HOMOL }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Atualizar API no Railway Prod
        working-directory: ./backend
        run: |
          rm -rf ../.git
          npm i -g @railway/cli
          railway status
          railway up --detach --service "52f3763a-bdbd-47f6-ad24-6f203c1ec0ce"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_HOMOL }}

  build-mobile:
    name: Gerar Builds para Lojas (Android & iOS)
    # if: github.event_name == 'push' -- Descomentar e comentar a linha abaixo para buildar
    if: false
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./mobile } }
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Instalar Dependências
        run: npm install

      - name: Configurar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Disparar Build Android (AAB para Google Play)
        run: eas build --platform android --profile production --non-interactive

      - name: Disparar Build iOS (IPA para App Store)
        run: eas build --platform ios --profile production --non-interactive