name: Esteira de Homologação (Homol)

on:
  pull_request:
    branches: [ "homol" ]
  push:
    branches: [ "homol" ]

jobs:
  check-source-branch:
    name: Validar Branch de Origem
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear origens não autorizadas
        if: github.head_ref != 'dev' && !startsWith(github.head_ref, 'hotfix/')
        run: |
          echo "ERRO DE GIT FLOW"
          echo "Pull Requests para a branch 'homol' só podem vir da 'dev' ou de um 'hotfix/'!"
          echo "Sua branch atual é: ${{ github.head_ref }}"
          exit 1

  frontend-checks:
    name: Validação (Frontend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install

  backend-checks:
    name: Compilação (Backend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - run: mvn clean compile -DskipTests

  deploy-infra:
    name: Atualizar Supabase e Railway
    if: github.event_name == 'push'
    needs: [ frontend-checks, backend-checks ]
    runs-on: ubuntu-latest
    environment: homol
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar Migrations no Supabase Homol
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID_HOMOL --password $SUPABASE_DB_PASSWORD_HOMOL
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_HOMOL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_HOMOL }}

      - name: Atualizar API no Railway Homol
        working-directory: ./backend
        run: |
          rm -rf ../.git
          npm i -g @railway/cli
          railway up --detach --service "rabisko-homol"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_HOMOL }}