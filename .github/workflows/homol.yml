name: Esteira de Homologação (Homol)

on:
  pull_request:
    branches: [ "homol" ]
  push:
    branches: [ "homol" ]

jobs:
  frontend-checks:
    name: Validação (Frontend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install

  backend-checks:
    name: Compilação (Backend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - run: mvn clean compile -DskipTests

  deploy-infra:
    name: Atualizar Supabase e Railway (Homol)
    if: github.event_name == 'push'
    needs: [frontend-checks, backend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Aplicar Migrations no Supabase Homol
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID_HOMOL }}" --password "${{ secrets.SUPABASE_DB_PASSWORD_HOMOL }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Atualizar API no Railway Homol
        working-directory: ./backend
        run: |
          rm -rf ../.git
          npm i -g @railway/cli
          railway up --detach --service "rabisko-homol"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_HOMOL }}