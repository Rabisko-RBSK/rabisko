spring.application.name=mvp
server.port=8080

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

api.security.token.secret=${JWT_SECRET:my-secret-key}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket.profile=profile_images
supabase.bucket.portfolio=portfolio_images

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
