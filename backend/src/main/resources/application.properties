spring.application.name=mvp
server.port=8080

# Importa as variáveis do arquivo .env na raiz do backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

api.security.token.secret=${JWT_SECRET:my-secret-key}

# ----------------------------------------------------------------------
# Conexão Dinâmica do Banco de Dados (Injetada pelo Railway / Profiles)
# ----------------------------------------------------------------------
# As credenciais agora vêm das variáveis de ambiente definidas no painel
# do Railway (DB_URL, DB_USER, DB_PASS). Isso garante que o mesmo código
# conecte em Dev, Homol ou Prod sem hardcode.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forçando o Dialeto do PostgreSQL (Evita o erro de JDBC Metadata na Nuvem)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Schema é dono do Supabase (tabelas users/clientes/tatuadores/estudios
# etc. já existem lá, com tipos ENUM nativos e UUIDs). Usamos `validate`
# para que o Hibernate, no boot, apenas CONFIRME que cada @Entity bate
# com a tabela correspondente — e estoure rápido se o mapeamento
# divergir. NUNCA usar `update`/`create` apontando para Supabase: o
# Hibernate iria tentar mexer nos schemas auth/storage/realtime/etc.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pool pequeno: o Supavisor já agrega conexões do lado do Supabase,
# então não precisamos abrir muitas do nosso lado.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Aumentando limites de upload de arquivos (15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ----------------------------------------------------------------------
# Supabase Storage — buckets para imagens do app (separado da config do
# banco). Usado pelo StorageService para upload via REST.
#
#   SUPABASE_URL              -> ex.: https://jfcpnoyqwyqwtbdshhfv.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY -> "service_role" key (Project Settings -> API).
#                                NUNCA expor no cliente; somente backend.
# Os buckets `profile_images` e `portfolio_images` devem estar como PUBLIC
# no painel do Supabase para que as URLs retornadas (.../object/public/...)
# sejam acessiveis sem token.
# ----------------------------------------------------------------------
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket.profile=profile_images
supabase.bucket.portfolio=portfolio_images

# Debug temporario do WebSocket pra diagnosticar transport error no STOMP
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG